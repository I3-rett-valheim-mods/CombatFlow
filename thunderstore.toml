# Read by tcli when publishing a prebuilt archive: --file cannot be combined
# with the identity flags, so the namespace, name and version come from here.
# versionNumber must match PluginInfo.cs and package/manifest.json; the release
# workflow refuses to publish if they disagree.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "I3_rett"
name = "CombatFlow"
versionNumber = "0.1.0"
description = "Client-side. Cuts sword, berserker-axe and dodge recovery right after the hit, like the emote cancel. Optional Max combo (auto) and Auto perfect parry change how the game counts attacks and blocks: check your server's rules. Both can be turned off."
websiteUrl = "https://github.com/I3-rett/CombatFlow"
containsNsfwContent = false

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build/out"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "tweaks"]
